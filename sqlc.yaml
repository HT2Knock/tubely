version: "2"
sql:
  - engine: "sqlite"
    schema: "sql/schema"
    queries: "sql/queries"
    gen:
      go:
        package: "database"
        out: "internal/database"
        sql_package: "database/sql"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_pointers_for_null_types: true
        overrides:
          - column: "users.id"
            go_type: "github.com/google/uuid.UUID"
          - column: "videos.id"
            go_type: "github.com/google/uuid.UUID"
          - column: "videos.user_id"
            go_type: "github.com/google/uuid.UUID"
          - column: "refresh_tokens.user_id"
            go_type: "github.com/google/uuid.UUID"
